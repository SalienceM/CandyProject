version: "3.9"
services:
  api:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./candy.db:/app/candy.db
      - /tmp/candy-worktrees:/tmp/candy-worktrees
    environment:
      - CANDY_DATABASE_URL=sqlite:////app/candy.db
    command: uvicorn candy.main:app --host 0.0.0.0 --port 8000

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    ports:
      - "5173:80"
    depends_on:
      - api
