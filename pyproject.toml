[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "candy-pm"
version = "0.1.0"
description = "A syntactic-sugar layer over Git/SVN for project management"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "sqlmodel>=0.0.19",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "gitpython>=3.1.43",
    "typer>=0.12.3",
    "jinja2>=3.1.4",
    "pandas>=2.2.0",
    "python-multipart>=0.0.9",
    "aiofiles>=23.2.1",
    "apscheduler>=3.10.4",
    "rich>=13.7.0",
    "toml>=0.10.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]

[project.scripts]
candy = "candy.cli:app"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
